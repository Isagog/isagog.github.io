<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="The Orchestrator coordinates five specialized agents: Navigator, Educator, Concierge, Facilitator and Opinionist">
  <rect width="1200" height="520" fill="#ffffff"/>

  <path d="M600 150 C600 235, 150 215, 150 300" fill="none" stroke="#86efac" stroke-width="1.5"/>
  <path d="M600 150 C600 235, 375 215, 375 300" fill="none" stroke="#86efac" stroke-width="1.5"/>
  <path d="M600 150 L600 300" fill="none" stroke="#86efac" stroke-width="1.5"/>
  <path d="M600 150 C600 235, 825 215, 825 300" fill="none" stroke="#86efac" stroke-width="1.5"/>
  <path d="M600 150 C600 235, 1050 215, 1050 300" fill="none" stroke="#86efac" stroke-width="1.5"/>

  <rect x="420" y="40" width="360" height="110" rx="14" fill="#0e2415" stroke="#4ade80" stroke-width="1.5"/>
  <text x="600" y="76" text-anchor="middle" fill="#86efac" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="3">ORCHESTRATION</text>
  <text x="600" y="108" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="26">Orchestrator</text>
  <text x="600" y="132" text-anchor="middle" fill="#a7f3d0" font-family="ui-monospace, Menlo, monospace" font-size="12">routes every question to the right specialist</text>

  <g>
    <rect x="45" y="300" width="210" height="170" rx="14" fill="#0e2415" stroke="#4ade80" stroke-width="1.5"/>
    <text x="150" y="336" text-anchor="middle" fill="#86efac" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2">WAYFINDING</text>
    <text x="150" y="370" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="22">Navigator</text>
    <text x="150" y="404" text-anchor="middle" fill="#d1e7d8" font-family="ui-monospace, Menlo, monospace" font-size="12">routes and spatial</text>
    <text x="150" y="424" text-anchor="middle" fill="#d1e7d8" font-family="ui-monospace, Menlo, monospace" font-size="12">relations, never</text>
    <text x="150" y="444" text-anchor="middle" fill="#d1e7d8" font-family="ui-monospace, Menlo, monospace" font-size="12">"left" or "right"</text>
  </g>

  <g>
    <rect x="270" y="300" width="210" height="170" rx="14" fill="#0e2415" stroke="#4ade80" stroke-width="1.5"/>
    <text x="375" y="336" text-anchor="middle" fill="#86efac" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2">CONTENT</text>
    <text x="375" y="370" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="22">Educator</text>
    <text x="375" y="404" text-anchor="middle" fill="#d1e7d8" font-family="ui-monospace, Menlo, monospace" font-size="12">artworks, artists,</text>
    <text x="375" y="424" text-anchor="middle" fill="#d1e7d8" font-family="ui-monospace, Menlo, monospace" font-size="12">exhibitions, themes</text>
  </g>

  <g>
    <rect x="495" y="300" width="210" height="170" rx="14" fill="#0e2415" stroke="#4ade80" stroke-width="1.5"/>
    <text x="600" y="336" text-anchor="middle" fill="#86efac" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2">SERVICES</text>
    <text x="600" y="370" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="22">Concierge</text>
    <text x="600" y="404" text-anchor="middle" fill="#d1e7d8" font-family="ui-monospace, Menlo, monospace" font-size="12">opening hours,</text>
    <text x="600" y="424" text-anchor="middle" fill="#d1e7d8" font-family="ui-monospace, Menlo, monospace" font-size="12">tickets, events,</text>
    <text x="600" y="444" text-anchor="middle" fill="#d1e7d8" font-family="ui-monospace, Menlo, monospace" font-size="12">amenities</text>
  </g>

  <g>
    <rect x="720" y="300" width="210" height="170" rx="14" fill="#0e2415" stroke="#4ade80" stroke-width="1.5"/>
    <text x="825" y="336" text-anchor="middle" fill="#86efac" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2">ACCESSIBILITY</text>
    <text x="825" y="370" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="22">Facilitator</text>
    <text x="825" y="404" text-anchor="middle" fill="#d1e7d8" font-family="ui-monospace, Menlo, monospace" font-size="12">Easy-to-Read and</text>
    <text x="825" y="424" text-anchor="middle" fill="#d1e7d8" font-family="ui-monospace, Menlo, monospace" font-size="12">descriptive language</text>
  </g>

  <g>
    <rect x="945" y="300" width="210" height="170" rx="14" fill="#0e2415" stroke="#4ade80" stroke-width="1.5"/>
    <text x="1050" y="336" text-anchor="middle" fill="#86efac" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2">LISTENING</text>
    <text x="1050" y="370" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="22">Opinionist</text>
    <text x="1050" y="404" text-anchor="middle" fill="#d1e7d8" font-family="ui-monospace, Menlo, monospace" font-size="12">visitor opinions</text>
    <text x="1050" y="424" text-anchor="middle" fill="#d1e7d8" font-family="ui-monospace, Menlo, monospace" font-size="12">and feedback</text>
  </g>

  <text x="600" y="505" text-anchor="middle" fill="#6b7280" font-family="ui-monospace, Menlo, monospace" font-size="12">one conversation — specialized agents grounded in the MAXXI Knowledge Graph</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Three working groups validated the system before launch: people with cognitive disabilities and neurodivergence, deaf people, and people with visual impairments">
  <rect width="1200" height="400" fill="#ffffff"/>

  <text x="60" y="70" fill="#0e2415" font-family="Georgia, serif" font-size="28">Validated with three working groups</text>
  <text x="60" y="98" fill="#4b5563" font-family="ui-monospace, Menlo, monospace" font-size="13">before launch — with the people who would actually use it</text>

  <g>
    <rect x="60" y="140" width="340" height="200" rx="14" fill="#0e2415" stroke="#4ade80" stroke-width="1.5"/>
    <text x="84" y="182" fill="#86efac" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2">GROUP 01</text>
    <text x="84" y="216" fill="#ffffff" font-family="Georgia, serif" font-size="20">People with cognitive</text>
    <text x="84" y="242" fill="#ffffff" font-family="Georgia, serif" font-size="20">disabilities and</text>
    <text x="84" y="268" fill="#ffffff" font-family="Georgia, serif" font-size="20">neurodivergence</text>
    <text x="84" y="312" fill="#a7f3d0" font-family="ui-monospace, Menlo, monospace" font-size="12">shaped the Easy-to-Read answers</text>
  </g>

  <g>
    <rect x="430" y="140" width="340" height="200" rx="14" fill="#0e2415" stroke="#4ade80" stroke-width="1.5"/>
    <text x="454" y="182" fill="#86efac" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2">GROUP 02</text>
    <text x="454" y="216" fill="#ffffff" font-family="Georgia, serif" font-size="20">Deaf people</text>
    <text x="454" y="312" fill="#a7f3d0" font-family="ui-monospace, Menlo, monospace" font-size="12">made Sign Language needs explicit</text>
  </g>

  <g>
    <rect x="800" y="140" width="340" height="200" rx="14" fill="#0e2415" stroke="#4ade80" stroke-width="1.5"/>
    <text x="824" y="182" fill="#86efac" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2">GROUP 03</text>
    <text x="824" y="216" fill="#ffffff" font-family="Georgia, serif" font-size="20">People with visual</text>
    <text x="824" y="242" fill="#ffffff" font-family="Georgia, serif" font-size="20">impairments</text>
    <text x="824" y="312" fill="#a7f3d0" font-family="ui-monospace, Menlo, monospace" font-size="12">drove tactile, non-visual wording</text>
  </g>
</svg>

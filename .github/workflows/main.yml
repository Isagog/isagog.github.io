name: Build Static Site
on:
  push:
    branches: [master, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build static export
        run: pnpm build

      # Produces ./out — a fully static bundle. Upload it as an artifact;
      # wire a deploy step here for your target host (Cloudflare Pages, S3,
      # GitHub Pages, Nginx/Apache, etc.).
      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: out
          retention-days: 7

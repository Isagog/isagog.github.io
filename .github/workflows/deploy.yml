name: Deploy Website
on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Download image details
        uses: actions/download-artifact@v4
        with:
          name: image-details

      - name: Set image environment
        run: cat image.env >> $GITHUB_ENV

      - name: Create compose override
        run: |
          cat > docker-compose.override.yml <<EOF
          services:
            website:
              image: ${{ env.WEBSITE_IMAGE }}
          EOF

      - name: Deploy service
        run: |
          export COMPOSE_PROJECT_NAME=isagog_website_${{ inputs.env }}
          docker compose down
          docker compose -f docker-compose.yml -f docker-compose.override.yml up -d

      - name: Check service health
        run: |
          sleep 5
          docker compose -p isagog_website_${{ inputs.env }} ps
          docker compose -p isagog_website_${{ inputs.env }} logs

name: Deploy Frontend
on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Download image details
        uses: actions/download-artifact@v4
        with:
          name: image-details

      - name: Set image environment
        run: cat image.env >> $GITHUB_ENV

      - name: Create compose override
        run: |
          cat > docker-compose.override.yaml <<EOF
          services:
            frontend:
              image: ${{ env.MEMA_FRONTEND_IMAGE }}
          EOF

      - name: Deploy service
        run: |
          export COMPOSE_PROJECT_NAME=isagog_website_${{ inputs.env }}
          export MEMA_FRONTEND_IMAGE=${{ env.MEMA_FRONTEND_IMAGE }}

          docker compose down
          docker compose -f docker-compose.yaml -f docker-compose.override.yaml up -d

      - name: Check service health
        run: |
          sleep 5
          docker compose -p isagog_website_${{ inputs.env }} ps
          docker compose -p isagog_website_${{ inputs.env }} logs
